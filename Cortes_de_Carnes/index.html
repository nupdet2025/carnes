<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cortes de Carnes Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Outfit', sans-serif;
      background-color: #f0f0f0;
      overflow: hidden;
    }

    .viewer-container {
      width: 100%;
      height: 80%;
      position: relative;
      background-color: #e0e0e0;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    model-viewer.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* --- BOTÃO RA PERSONALIZADO (Topo Direito) --- */
    .custom-ar-button {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      z-index: 2000;
      box-shadow: 0 4px 12px rgba(0,123,255,0.3);
      transition: all 0.2s ease;
      pointer-events: auto !important;
    }

    /* REMOVER BOTÕES NATIVOS */
    model-viewer::part(default-ar-button),
    model-viewer::part(ar-button),
    model-viewer::part(ar-prompt) {
      display: none !important;
    }

    /* --- NAVEGAÇÃO MODERNA --- */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      z-index: 1500;
      transition: all 0.2s ease;
    }
    .nav-btn:active { transform: translateY(-50%) scale(0.9); }
    .prev-btn { left: 20px; }
    .next-btn { right: 20px; }

    /* --- BOTÃO DE ANIMAÇÃO --- */
    .animation-overlay-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 12px;
      z-index: 1000;
      cursor: pointer;
    }
    .animation-overlay-btn.reverse { background-color: #f4a261; }

    /* --- HOTSPOTS E LABELS (RECUPERADOS) --- */
    .hotspot-point {
      width: 14px; height: 14px; border-radius: 50%;
      border: 3px solid white; background-color: #007bff;
      box-shadow: 0 0 15px rgba(0,123,255,0.6);
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }

    .hotspot-label {
      position: absolute; padding: 4px 8px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px); border-radius: 4px;
      font-size: 10px; font-weight: 700; color: #1a1a1a;
      text-transform: uppercase; opacity: 0;
      transform: translateY(-50%); transition: opacity 0.3s;
      z-index: 20;
    }
    .hotspot-label.left { right: auto; left: 10px; border-right: 2px solid #007bff; }
    .hotspot-label.right { left: auto; right: 10px; border-left: 2px solid #007bff; }

    .line-container {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; pointer-events: none;
      z-index: 10; overflow: visible !important;
    }
    .line { stroke: #007bff; stroke-width: 1.5; opacity: 0; transition: opacity 0.3s; }

    /* Ocultar elementos se o viewer não estiver ativo */
    model-viewer:not(.active) .hotspot-point,
    model-viewer:not(.active) .hotspot-label,
    model-viewer:not(.active) .line-container {
      display: none;
    }
  </style>
</head>
<body>

  <div class="viewer-container">
    <button id="prev-btn" class="nav-btn prev-btn" style="display: none;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <button id="next-btn" class="nav-btn next-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg>
    </button>

    <model-viewer id="mv-0" class="active" src="modelos/01.glb" ios-src="modelos/01.usdz" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1">
        <button slot="ar-button" class="custom-ar-button">Realidade Aumentada</button>
        <button class="animation-overlay-btn">Pendurar</button>
    </model-viewer>

    <model-viewer id="mv-1" src="modelos/02.glb" ios-src="modelos/02.usdz" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1">
        <button slot="ar-button" class="custom-ar-button">Realidade Aumentada</button>
        <button class="animation-overlay-btn">Pendurar</button>
    </model-viewer>

    <model-viewer id="mv-2" src="modelos/03.glb" ios-src="modelos/03.usdz" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1">
        <button slot="ar-button" class="custom-ar-button">Realidade Aumentada</button>
        <button class="animation-overlay-btn">Pendurar</button>
    </model-viewer>

    <model-viewer id="mv-3" src="modelos/04.glb" ios-src="modelos/04.usdz" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" camera-controls shadow-intensity="1">
        <button slot="ar-button" class="custom-ar-button">Realidade Aumentada</button>
        <button class="animation-overlay-btn">Pendurar</button>

        <button slot="hotspot-cupim" class="hotspot-point" data-surface="0 0 2079 1061 1062 0.342 0.100 0.558"></button>
        <button slot="hotspot-3" class="hotspot-point" data-surface="0 0 2199 1911 1912 0.818 0.167 0.015"></button>
        <button slot="hotspot-4" class="hotspot-point" data-surface="0 0 2305 2306 462 0.324 0.077 0.599"></button>
        <button slot="hotspot-5" class="hotspot-point" data-surface="0 0 1193 2651 1189 0.242 0.517 0.240"></button>
        <button slot="hotspot-8" class="hotspot-point" data-surface="0 0 2746 2236 2744 0.671 0.328 0.001"></button>
        <button slot="hotspot-9" class="hotspot-point" data-surface="0 0 1321 1327 1326 0.294 0.387 0.319"></button>
        <button slot="hotspot-10" class="hotspot-point" data-surface="0 0 1765 1751 1752 0.083 0.366 0.552"></button>
        <button slot="hotspot-11" class="hotspot-point" data-surface="0 0 1843 1150 1157 0.005 0.311 0.684"></button>
        <button slot="hotspot-12" class="hotspot-point" data-surface="0 0 3080 3081 3083 0.182 0.688 0.130"></button>

        <svg class="line-container">
            <line id="line-cupim" class="line"></line> <line id="line-3" class="line"></line>
            <line id="line-4" class="line"></line> <line id="line-5" class="line"></line>
            <line id="line-8" class="line"></line> <line id="line-9" class="line"></line>
            <line id="line-10" class="line"></line> <line id="line-11" class="line"></line>
            <line id="line-12" class="line"></line>
        </svg>

        <div id="label-8" class="hotspot-label left" style="top: 10%;">COXÃO DURO COM LAGARTO</div>
        <div id="label-11" class="hotspot-label left" style="top: 30%;">PONTA DE AGULHA</div>
        <div id="label-12" class="hotspot-label left" style="top: 42%;">FILÉ MIGNON</div>
        <div id="label-9" class="hotspot-label left" style="top: 70%;">PALETA</div>
        <div id="label-10" class="hotspot-label left" style="top: 90%;">ACÉM</div>
        <div id="label-5" class="hotspot-label right" style="top: 25%;">ALCATRA COM MAMINHA</div>
        <div id="label-4" class="hotspot-label right" style="top: 50%;">PICANHA</div>
        <div id="label-3" class="hotspot-label right" style="top: 70%;">CONTRAFILÉ</div>
        <div id="label-cupim" class="hotspot-label right" style="top: 90%;">CUPIM</div>
    </model-viewer>
  </div>

  <script>
    const viewers = [document.getElementById('mv-0'), document.getElementById('mv-1'), document.getElementById('mv-2'), document.getElementById('mv-3')];
    let currentIndex = 0;
    let isAtEnd = false;

    const playBtns = document.querySelectorAll('.animation-overlay-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    const hotspotsConfig = [
        { name: 'hotspot-cupim', labelId: 'label-cupim', lineId: 'line-cupim' },
        { name: 'hotspot-3', labelId: 'label-3', lineId: 'line-3' },
        { name: 'hotspot-4', labelId: 'label-4', lineId: 'line-4' },
        { name: 'hotspot-5', labelId: 'label-5', lineId: 'line-5' },
        { name: 'hotspot-8', labelId: 'label-8', lineId: 'line-8' },
        { name: 'hotspot-9', labelId: 'label-9', lineId: 'line-9' },
        { name: 'hotspot-10', labelId: 'label-10', lineId: 'line-10' },
        { name: 'hotspot-11', labelId: 'label-11', lineId: 'line-11' },
        { name: 'hotspot-12', labelId: 'label-12', lineId: 'line-12' }
    ];

    function updateUI() {
      viewers.forEach((v, i) => v.classList.toggle('active', i === currentIndex));
      prevBtn.style.display = currentIndex === 0 ? 'none' : 'flex';
      nextBtn.style.display = currentIndex === viewers.length - 1 ? 'none' : 'flex';
      playBtns.forEach(btn => {
        btn.textContent = isAtEnd ? 'Voltar' : 'Pendurar';
        btn.classList.toggle('reverse', isAtEnd);
      });
    }

    // Navegação
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) { currentIndex--; updateUI(); } });
    nextBtn.addEventListener('click', () => { if (currentIndex < viewers.length - 1) { currentIndex++; updateUI(); } });

    // Animação
    playBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        isAtEnd = !isAtEnd;
        viewers.forEach(v => {
          if (isAtEnd) { v.currentTime = 0; v.play({ repetitions: 1 }); } 
          else { v.pause(); v.currentTime = 0; }
        });
        updateUI();
      });
    });

    // Sincronização de Câmera
    viewers.forEach((v, i) => {
      v.addEventListener('camera-change', () => {
        if (i !== currentIndex || v.getAttribute('ar-status') === 'session-started') return;
        const orbit = v.getCameraOrbit().toString();
        const target = v.getCameraTarget().toString();
        viewers.forEach((other, j) => { if (j !== currentIndex) { other.cameraOrbit = orbit; other.cameraTarget = target; } });
      });
    });

    // Lógica das Linhas e Etiquetas (Modelo 04)
    function updateLines() {
      if (currentIndex === 3) {
        const mv = viewers[3];
        hotspotsConfig.forEach(config => {
          const hotspot = mv.queryHotspot(config.name);
          const hotspotElem = mv.querySelector(`[slot="${config.name}"]`);
          const label = document.getElementById(config.labelId);
          const line = document.getElementById(config.lineId);
          
          if (hotspot && hotspotElem && label && line) {
            const { x, y } = hotspot.canvasPosition;
            if ((x === 0 && y === 0) || !isAtEnd) {
              line.style.opacity = '0'; hotspotElem.style.opacity = '0'; label.style.opacity = '0';
            } else {
              line.setAttribute('x1', x); line.setAttribute('y1', y);
              const isLeft = label.classList.contains('left');
              line.setAttribute('x2', isLeft ? label.offsetLeft + label.offsetWidth : label.offsetLeft);
              line.setAttribute('y2', label.offsetTop);
              const isVisible = hotspot.facingCamera;
              line.style.opacity = isVisible ? '1' : '0';
              hotspotElem.style.opacity = isVisible ? '1' : '0';
              label.style.opacity = '1';
            }
          }
        });
      }
      requestAnimationFrame(updateLines);
    }

    viewers[3].addEventListener('load', () => { if (currentIndex === 3) updateLines(); });
    updateLines();
    updateUI();
  </script>
</body>
</html>
